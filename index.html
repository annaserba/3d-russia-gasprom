  <script>
    const loader = document.querySelector('.loader');
    const mapShell = document.querySelector('.map-shell');
    const mapSvg = document.querySelector('svg');
    const mapPulse = document.querySelector('#mapPulse');
    const tooltip = document.querySelector('.map-tooltip');
    const points = [...document.querySelectorAll('.point')];
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const defaultPulse = { x: 340, y: 300 };

    points.forEach((point) => {
      const label = point.querySelector('.label')?.textContent?.trim() || '';
      point.dataset.title = label;
      point.dataset.caption = getCaption(label);
      point.setAttribute('tabindex', '0');
      point.setAttribute('role', 'button');
      point.setAttribute('aria-label', label);

      point.addEventListener('mouseenter', () => showTooltip(point));
      point.addEventListener('focus', () => showTooltip(point));
      point.addEventListener('mouseleave', hideTooltip);
      point.addEventListener('blur', hideTooltip);
    });

    if (!prefersReducedMotion) {
      loader.addEventListener('pointermove', (event) => {
        const rect = loader.getBoundingClientRect();
        const x = (event.clientX - rect.left) / rect.width;
        const y = (event.clientY - rect.top) / rect.height;
        const tiltX = (0.5 - y) * 8;
        const tiltY = (x - 0.5) * 10;
        const svgCursor = getSvgCursor(event);

        mapShell.classList.add('is-interactive');
        mapShell.style.transform = `rotateX(${8 + tiltX}deg) rotateZ(${-1 + tiltY * 0.08}deg) translate3d(${(x - 0.5) * 12}px, ${(y - 0.5) * 8}px, 0) scale(1.045)`;

        if (svgCursor) {
          moveMapPulse(svgCursor.x, svgCursor.y);
        }
      });

      loader.addEventListener('pointerleave', () => {
        mapShell.classList.remove('is-interactive');
        mapShell.style.transform = '';
        moveMapPulse(defaultPulse.x, defaultPulse.y);
        hideTooltip();
      });
    }

    function getSvgCursor(event) {
      const matrix = mapSvg.getScreenCTM();
      if (!matrix) return null;

      const point = mapSvg.createSVGPoint();
      point.x = event.clientX;
      point.y = event.clientY;

      return point.matrixTransform(matrix.inverse());
    }

    function moveMapPulse(x, y) {
      const clampedX = Math.min(Math.max(x, 130), 980);
      const clampedY = Math.min(Math.max(y, 205), 405);

      mapPulse.setAttribute(
        'gradientTransform',
        `translate(${clampedX.toFixed(1)} ${clampedY.toFixed(1)}) rotate(19) scale(520 180)`,
      );
    }

    function showTooltip(point) {
      points.forEach((item) => item.classList.toggle('is-active', item === point));

      tooltip.innerHTML = `
        <span>${point.dataset.title}</span>
        <strong>${point.dataset.caption}</strong>
      `;
      tooltip.classList.add('is-visible');

      const matrix = point.transform.baseVal.consolidate()?.matrix;
      if (!matrix) return;

      const svg = point.ownerSVGElement;
      const svgPoint = svg.createSVGPoint();
      svgPoint.x = matrix.e;
      svgPoint.y = matrix.f;
      const screenPoint = svgPoint.matrixTransform(svg.getScreenCTM());
      const loaderRect = loader.getBoundingClientRect();

      tooltip.style.left = `${screenPoint.x - loaderRect.left}px`;
      tooltip.style.top = `${screenPoint.y - loaderRect.top}px`;
    }

    function hideTooltip() {
      points.forEach((point) => point.classList.remove('is-active'));
      tooltip.classList.remove('is-visible');
    }

    function getCaption(label) {
      const captions = {
        'Москва': 'Координационный центр',
        'Санкт-Петербург': 'Северо-западный узел',
        'Ухта': 'Производственный маршрут',
        'Оренбург': 'Регион присутствия',
        'Уфа': 'Крупный офисный центр',
        'Астрахань': 'Южное направление',
        'Тюмень': 'Западная Сибирь',
        'Ямал': 'Ключевой газовый кластер',
        'Новый Уренгой': 'Северный производственный узел',
        'Южно-Сахалинск': 'Дальневосточное направление',
      };

      return captions[label] || 'Точка присутствия';
    }
  </script>
</body>
